{% extends 'new_base.html' %}
{% load i18n %}
{% block title %}{%trans "Logged Out"%} - {%trans "BookHub"%}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body text-center">
                <h2>{%trans "Logged Out Successfully"%}</h2>
                <p class="mt-3">{%trans "You have been successfully logged out."%}</p>
                <div class="mt-4">
                    <a href="{% url 'login' %}" class="btn btn-primary">{%trans "Login Again"%}</a>
                    <a href="{% url 'home' %}" class="btn btn-secondary">{%trans "Return to Home"%}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
